name: Release Package

on:
  workflow_dispatch:
    inputs:
      skip_hardware_checks:
        description: Publish without hardware validation when the processor or local runner is unavailable
        required: false
        type: boolean
        default: false
      hardware_skip_reason:
        description: Reason for skipping hardware checks (required when selected)
        required: false
        type: string
  release:
    types:
      - published

permissions:
  actions: read
  checks: read
  contents: write

jobs:
  build-and-upload-package:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    runs-on: windows-latest
    env:
      MANIFESTUTIL_VERSION: 29.0.10
      NET472_REFERENCE_ASSEMBLIES: C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.7.2
      NETFX_RUNTIME_DIR: C:\Windows\Microsoft.NET\Framework64\v4.0.30319
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify configured release checks
        shell: pwsh
        working-directory: ${{ github.workspace }}/.
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRED_RELEASE_CHECKS: ${{ vars.RELEASE_REQUIRED_CHECKS }}
          REQUIRED_HOSTED_WORKFLOWS: '["tests.yml","workflow-discovery.yml"]'
          RELEASE_SKIP_HARDWARE_CHECKS: ${{ inputs.skip_hardware_checks }}
          RELEASE_HARDWARE_SKIP_REASON: ${{ inputs.hardware_skip_reason }}
        run: '& ./.github/scripts/Wait-RequiredReleaseChecks.ps1'
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2

      - name: Install ILRepack tool
        shell: pwsh
        run: |
          dotnet tool install --global dotnet-ilrepack --version 2.0.45
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install ManifestUtil package
        shell: pwsh
        run: |
          nuget install Crestron.DeviceDrivers.ManifestUtil -Version $env:MANIFESTUTIL_VERSION -OutputDirectory "$env:RUNNER_TEMP\nuget-tools"

      - name: Resolve ManifestUtil path
        id: manifestutil
        shell: pwsh
        run: |
          $toolRoot = Join-Path $env:RUNNER_TEMP "nuget-tools\Crestron.DeviceDrivers.ManifestUtil.$env:MANIFESTUTIL_VERSION"
          $manifestUtil = Join-Path $toolRoot 'tools/net8.0/any/ManifestUtil.exe'
          if (!(Test-Path -LiteralPath $manifestUtil -PathType Leaf)) { throw 'Complete ManifestUtil tool package was not found.' }
          "exe_path=$manifestUtil" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Check out processor test SDK
        uses: actions/checkout@v4
        with:
          repository: oznetmaster/CrestronHomeNUnit
          ref: 43bdfcf04756f485fcf069dff529534be204a412
          path: .test-sdk

      - name: Run driver unit tests
        shell: pwsh
        run: ./tools/Test-DiscoveredCoverage.ps1 -Stage Desktop -Project WeatherLinkLiveCrestronDriver.Tests/WeatherLinkLiveCrestronDriver.Tests.csproj -Framework net472 -AllowProcessorSkips -ResultsDirectory TestResults
      - name: Use the public desktop SDK dependency
        shell: pwsh
        run: |
          $runtime = Split-Path -Parent '${{ steps.manifestutil.outputs.exe_path }}'
          $compact = Join-Path $runtime 'Newtonsoft.Json.Compact.dll'
          if ((Get-FileHash -LiteralPath $compact -Algorithm SHA256).Hash -ne '8b9567057419e97b20702a4364283b0b5c34d5e00e006e329e1c92b74638ef90') { throw 'Unexpected desktop SDK dependency checksum.' }
          "CompactJsonPath=$compact" >> $env:GITHUB_ENV
      - name: Run desktop SDK lifecycle harness
        shell: pwsh
        run: |
          ./tools/Test-DiscoveredCoverage.ps1 -Stage Desktop -Project WeatherLinkLiveCrestronDriver.Lifecycle.Tests/WeatherLinkLiveCrestronDriver.Lifecycle.Tests.csproj -Framework net10.0 -ResultsDirectory TestResults

      - name: Restore dependencies
        run: dotnet restore WeatherLinkLiveCrestronDriver/WeatherLinkLiveCrestronDriver.csproj

      - name: Verify driver version rules
        shell: pwsh
        run: ./tools/Test-DriverVersioning.ps1

      - name: Determine release version
        id: package_version
        shell: pwsh
        run: |
          $refName = if ($env:GITHUB_EVENT_NAME -eq 'release' -and $env:GITHUB_EVENT_PATH) {
            (Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json).release.tag_name
          } else { $env:GITHUB_REF_NAME }
          $selected = & ./tools/Get-DriverReleaseVersion.ps1 -ManifestPath @('./WeatherLinkLiveCrestronDriver/WeatherlinkLiveCrestronDriver.json') -Tag $refName -RequireTag:($env:GITHUB_EVENT_NAME -eq 'release')
          "value=$($selected.PackageVersion)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "driver=$($selected.DriverReleaseVersion)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$($selected.Tag)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build release package
        shell: pwsh
        run: |
          dotnet build WeatherLinkLiveCrestronDriver/WeatherLinkLiveCrestronDriver.csproj -c Release -p:ManifestUtilExe="${{ steps.manifestutil.outputs.exe_path }}" -p:LocalNet472ReferenceAssemblies="$env:NET472_REFERENCE_ASSEMBLIES" -p:LocalNetFxRuntimeDir="$env:NETFX_RUNTIME_DIR" -p:MergeDependenciesContinueOnError=false -p:PackageDriverContinueOnError=false -p:PackageDriverIgnoreExitCode=false -p:DriverReleaseVersion="${{ steps.package_version.outputs.driver }}"

      - name: Build and validate processor test package
        shell: pwsh
        run: |
          dotnet build WeatherLinkLiveCrestronDriver.ProcessorTests/WeatherLinkLiveCrestronDriver.ProcessorTests.csproj -c Release -p:BuildProcessorTestPackages=true -p:DeployAfterBuild=false "-p:ProcessorTestSdkRoot=$env:GITHUB_WORKSPACE\.test-sdk" "-p:ManifestUtilExe=${{ steps.manifestutil.outputs.exe_path }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $extracted = Join-Path $env:RUNNER_TEMP 'weatherlink-driver-tests'
          [IO.Compression.ZipFile]::ExtractToDirectory((Join-Path $PWD 'WeatherLinkLiveCrestronDriver.ProcessorTests/bin/Release/net472/WeatherLinkLiveCrestronDriver.ProcessorTests.pkg'), $extracted)
          ./tools/Test-DiscoveredCoverage.ps1 -Stage Package -SdkRoot ./.test-sdk -PackageAssembly (Join-Path $extracted 'WeatherLinkLiveCrestronDriver.ProcessorTests.dll') -SourceInventory TestResults/WeatherLinkLiveCrestronDriver.Lifecycle.Tests/inventory.json -ResultsDirectory TestResults
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Locate package
        id: package
        shell: pwsh
        run: |
          $pkg = Get-Item -LiteralPath "$env:GITHUB_WORKSPACE\WeatherLinkLiveCrestronDriver\bin\Release\net472\NeilColvin_WeatherStation_WeatherLinkLive_IP_V2.pkg" -ErrorAction Stop
          if ($null -eq $pkg) {
            throw 'No .pkg file was generated in WeatherLinkLiveCrestronDriver/bin/Release.'
          }

          & ./tools/Assert-DriverPackageVersion.ps1 -PackagePath $pkg.FullName -ManifestPath './WeatherLinkLiveCrestronDriver/WeatherlinkLiveCrestronDriver.json' -ReleaseVersion '${{ steps.package_version.outputs.value }}' -ProductAssetsDirectory './WeatherLinkLiveCrestronDriver/IncludeInPkg'

          "pkg_path=$($pkg.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8


      - name: Pack NuGet package
        shell: pwsh
        run: |
          $outputDir = Join-Path $env:RUNNER_TEMP 'nuget-package'
          $manifestPath = Join-Path $env:RUNNER_TEMP 'crestron-driver-package.json'
          New-Item -ItemType Directory -Path $outputDir -Force | Out-Null

          $manifest = @{
            standardVersion = '1.0'
            packageType = 'CrestronHomeDriver'
            driverPlatform = 'Crestron Home'
            payloadType = 'pkg'
            payloadFile = [System.IO.Path]::GetFileName("${{ steps.package.outputs.pkg_path }}")
            containsManagedDllPayload = $false
            packageId = 'CrestronHomeDriver.WeatherLinkLive.WeatherStation'
            packageVersion = "${{ steps.package_version.outputs.value }}"
            displayName = 'WeatherLink Live Weather Station Driver'
            vendor = 'WeatherLink Live'
            driverCategory = 'Weather'
          } | ConvertTo-Json -Depth 5

          Set-Content -Path $manifestPath -Value $manifest -Encoding UTF8

          dotnet pack WeatherLinkLiveCrestronDriver/WeatherLinkLiveCrestronDriver.csproj -c Release --no-build --output $outputDir -p:PackageVersion="${{ steps.package_version.outputs.value }}" -p:PackageDriverPkgPath="${{ steps.package.outputs.pkg_path }}" -p:PackageDriverManifestPath="$manifestPath"

      - name: Locate NuGet package
        id: nuget_package
        shell: pwsh
        run: |
          $nupkg = Get-ChildItem -Path (Join-Path $env:RUNNER_TEMP 'nuget-package') -Filter *.nupkg -File |
            Where-Object { $_.Name -notlike '*.symbols.nupkg' } |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1

          if ($null -eq $nupkg) {
            throw 'No NuGet package (.nupkg) was generated.'
          }

          "nupkg_path=$($nupkg.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish NuGet package
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) {
            throw 'NUGET_API_KEY secret is not configured.'
          }

          dotnet nuget push "${{ steps.nuget_package.outputs.nupkg_path }}" --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: WeatherLinkLiveCrestronDriver-pkg
          path: ${{ steps.package.outputs.pkg_path }}
          if-no-files-found: error

      - name: Upload package asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          files: |
            ${{ steps.package.outputs.pkg_path }}
            WeatherLinkLiveCrestronDriver.ProcessorTests/bin/Release/net472/WeatherLinkLiveCrestronDriver.ProcessorTests.pkg
          fail_on_unmatched_files: true