name: Release NuGet documentation patch

on:
  workflow_dispatch:
    inputs:
      skip_desktop_checks:
        description: Reuse reviewed desktop results; package integrity checks still run
        required: false
        type: boolean
        default: false
      desktop_skip_reason:
        description: Tested source, completion time, frameworks, counts and evidence
        required: false
        type: string
      validation_commit:
        description: Reuse recent CI from an ancestor SHA with only docs or release-automation changes
        required: false
        type: string
      skip_hardware_checks:
        description: Reuse reviewed processor results or record unavailable hardware
        required: false
        type: boolean
        default: false
      hardware_skip_reason:
        description: Tested source, completion time, results and cleanup or unavailability reason
        required: false
        type: string
      base_version:
        description: Existing public NuGet version
        required: true
        type: string
      version:
        description: Next NuGet patch version (driver payload stays unchanged)
        required: true
        type: string

permissions:
  actions: read
  checks: read
  contents: write

concurrency:
  group: public-release
  cancel-in-progress: false
  queue: max

jobs:
  documentation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify configured release checks
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRED_RELEASE_CHECKS: ${{ vars.RELEASE_REQUIRED_CHECKS }}
          REQUIRED_HOSTED_WORKFLOWS: '["tests.yml","workflow-discovery.yml"]'
        run: |
          Write-Output 'Configured checks are verified by the following shared-policy action.'
      - name: Verify shared release policy
        uses: oznetmaster/CrestronHomeNUnit/.github/actions/release-validation@2ae8197c6685099c2133e7bb962d1f3568aae9c3
        with:
          required-checks: "${{ vars.RELEASE_REQUIRED_CHECKS }}"
          hosted-workflows: "[\"tests.yml\",\"workflow-discovery.yml\"]"
          skip-hardware-checks: "${{ inputs.skip_hardware_checks }}"
          hardware-skip-reason: "${{ inputs.hardware_skip_reason }}"
          skip-desktop-checks: "${{ inputs.skip_desktop_checks }}"
          desktop-skip-reason: "${{ inputs.desktop_skip_reason }}"
          validation-commit: "${{ inputs.validation_commit }}"
      - uses: NuGet/setup-nuget@v2
      - name: Repack documentation without rebuilding the driver
        shell: pwsh
        env:
          BASE_VERSION: ${{ inputs.base_version }}
          PATCH_VERSION: ${{ inputs.version }}
        run: ./tools/New-NuGetDocumentationPatch.ps1 -BaseVersion $env:BASE_VERSION -Version $env:PATCH_VERSION -OutputDirectory "$env:RUNNER_TEMP/documentation-patch"
      - name: Publish the verified documentation patch
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) { throw 'NuGet publication key is not configured.' }
          $package = Get-Item "$env:RUNNER_TEMP/documentation-patch/CrestronHomeDriver.WeatherLinkLive.WeatherStation.${{ inputs.version }}.nupkg"
          nuget push $package.FullName -ApiKey $env:NUGET_API_KEY -Source https://api.nuget.org/v3/index.json -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw 'NuGet publication failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-documentation-patch
          path: ${{ runner.temp }}/documentation-patch/*.nupkg
          if-no-files-found: error
