name: Tests
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: driver
    steps:
      - uses: actions/checkout@v4
        with:
          path: driver
      - uses: actions/checkout@v4
        with:
          repository: oznetmaster/CrestronHomeNUnit
          ref: 43bdfcf04756f485fcf069dff529534be204a412
          path: CrestronHomeNUnit
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x
      - uses: NuGet/setup-nuget@v2
      - name: Install processor packaging tools
        run: |
          dotnet tool install --global dotnet-ilrepack --version 2.0.45
          if ($LASTEXITCODE -ne 0) { throw 'ILRepack installation failed.' }
          "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH
      - name: Verify discovery coverage guards
        run: ./tools/Test-DiscoveredCoverageGuards.ps1
      - name: Run NUnit driver tests
        run: |
          ./tools/Test-DiscoveredCoverage.ps1 -Stage Desktop -Project WeatherLinkLiveCrestronDriver.Tests/WeatherLinkLiveCrestronDriver.Tests.csproj -Framework net472 -AllowProcessorSkips -ResultsDirectory TestResults
      - name: Install public desktop SDK and packaging dependency
        shell: pwsh
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'weatherlink-public-tools'
          nuget install Crestron.DeviceDrivers.ManifestUtil -Version 29.0.10 -OutputDirectory $tools -NonInteractive -Source https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE -ne 0) { throw 'ManifestUtil package installation failed.' }
          $runtime = Join-Path $tools 'Crestron.DeviceDrivers.ManifestUtil.29.0.10/tools/net8.0/any'
          $compact = Join-Path $runtime 'Newtonsoft.Json.Compact.dll'
          $manifest = Join-Path $runtime 'ManifestUtil.exe'
          if (!(Test-Path -LiteralPath $manifest)) { throw 'ManifestUtil.exe is missing from the complete tool package.' }
          if ((Get-FileHash -LiteralPath $compact -Algorithm SHA256).Hash -ne '8b9567057419e97b20702a4364283b0b5c34d5e00e006e329e1c92b74638ef90') { throw 'Unexpected desktop SDK dependency checksum.' }
          "CompactJsonPath=$compact" >> $env:GITHUB_ENV
          "MANIFEST_UTIL_EXE=$manifest" >> $env:GITHUB_ENV
      - name: Run desktop SDK lifecycle harness
        run: |
          ./tools/Test-DiscoveredCoverage.ps1 -Stage Desktop -Project WeatherLinkLiveCrestronDriver.Lifecycle.Tests/WeatherLinkLiveCrestronDriver.Lifecycle.Tests.csproj -Framework net10.0 -ResultsDirectory TestResults
      - name: Build processor package
        run: |
          dotnet build WeatherLinkLiveCrestronDriver.ProcessorTests/WeatherLinkLiveCrestronDriver.ProcessorTests.csproj -c Release -p:BuildProcessorTestPackages=true -p:ReleaseVersion=1.0.0 -p:DeployAfterBuild=false "-p:ManifestUtilExe=$env:MANIFEST_UTIL_EXE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run the packaged unit suite twice
        run: |
          $output = Join-Path $PWD 'WeatherLinkLiveCrestronDriver.ProcessorTests/bin/Release/net472'
          $extracted = Join-Path $env:RUNNER_TEMP 'driver-package-tests'
          [IO.Compression.ZipFile]::ExtractToDirectory((Join-Path $output 'WeatherLinkLiveCrestronDriver.ProcessorTests.pkg'), $extracted)
          ./tools/Test-DiscoveredCoverage.ps1 -Stage Package -SdkRoot ../CrestronHomeNUnit -PackageAssembly (Join-Path $extracted 'WeatherLinkLiveCrestronDriver.ProcessorTests.dll') -SourceInventory TestResults/WeatherLinkLiveCrestronDriver.Lifecycle.Tests/inventory.json -ResultsDirectory TestResults
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: driver/TestResults
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: WeatherLinkLiveCrestronDriver-processor-tests
          path: driver/WeatherLinkLiveCrestronDriver.ProcessorTests/bin/Release/net472/WeatherLinkLiveCrestronDriver.ProcessorTests.pkg
          if-no-files-found: error