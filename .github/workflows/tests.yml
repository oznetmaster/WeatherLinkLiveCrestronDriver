name: Tests
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: driver
    steps:
      - uses: actions/checkout@v4
        with:
          path: driver
      - uses: actions/checkout@v4
        with:
          repository: oznetmaster/CrestronHomeNUnit
          ref: 5a2d8080b2bbf7221bc8fc4cc53b35ac5bec4d1c
          path: CrestronHomeNUnit
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x
      - uses: NuGet/setup-nuget@v2
      - name: Install processor packaging tools
        run: |
          dotnet tool install --global dotnet-ilrepack --version 2.0.45
          if ($LASTEXITCODE -ne 0) { throw 'ILRepack installation failed.' }
          "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH
      - name: Verify discovery coverage guards
        uses: oznetmaster/BuildAutomation@ae6f311e530a18dc705971dcc655fc97de03e368
        with:
          task: tests-tests-verify-discovery-coverage-guards
          root: driver
      - name: Run NUnit driver tests
        uses: oznetmaster/BuildAutomation@ae6f311e530a18dc705971dcc655fc97de03e368
        with:
          task: tests-tests-run-nunit-driver-tests
          root: driver
      - name: Install public desktop SDK and packaging dependency
        shell: pwsh
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'weatherlink-public-tools'
          nuget install Crestron.DeviceDrivers.ManifestUtil -Version 29.0.10 -OutputDirectory $tools -NonInteractive -Source https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE -ne 0) { throw 'ManifestUtil package installation failed.' }
          $runtime = Join-Path $tools 'Crestron.DeviceDrivers.ManifestUtil.29.0.10/tools/net8.0/any'
          $compact = Join-Path $runtime 'Newtonsoft.Json.Compact.dll'
          $manifest = Join-Path $runtime 'ManifestUtil.exe'
          if (!(Test-Path -LiteralPath $manifest)) { throw 'ManifestUtil.exe is missing from the complete tool package.' }
          if ((Get-FileHash -LiteralPath $compact -Algorithm SHA256).Hash -ne '8b9567057419e97b20702a4364283b0b5c34d5e00e006e329e1c92b74638ef90') { throw 'Unexpected desktop SDK dependency checksum.' }
          "CompactJsonPath=$compact" >> $env:GITHUB_ENV
          "MANIFEST_UTIL_EXE=$manifest" >> $env:GITHUB_ENV
      - name: Run desktop SDK lifecycle harness
        uses: oznetmaster/BuildAutomation@ae6f311e530a18dc705971dcc655fc97de03e368
        with:
          task: tests-tests-run-desktop-sdk-lifecycle-harness
          root: driver
      - name: Build processor package
        uses: oznetmaster/BuildAutomation@ae6f311e530a18dc705971dcc655fc97de03e368
        with:
          task: tests-tests-build-processor-package
          root: driver
      - name: Run the packaged unit suite twice
        uses: oznetmaster/BuildAutomation@ae6f311e530a18dc705971dcc655fc97de03e368
        with:
          task: tests-tests-run-the-packaged-unit-suite-twice
          root: driver
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: driver/TestResults
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: WeatherLinkLiveCrestronDriver-processor-tests
          path: driver/WeatherLinkLiveCrestronDriver.ProcessorTests/bin/Release/net472/WeatherLinkLiveCrestronDriver.ProcessorTests.pkg
          if-no-files-found: error